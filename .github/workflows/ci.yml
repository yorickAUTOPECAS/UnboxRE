# =============================================================================
# .github/workflows/ci.yml — validação do toolkit UnboxRE.
#
# Não instala ferramentas de RE (o CI não analisa binários): valida a integridade
# do que é PUBLICADO — documentação obrigatória, templates válidos, scripts sem
# erros de sintaxe e, o mais importante, ausência de segredos e binários.
#
# Por que isto existe: o repositório é público e MIT. Um token vazado ou uma
# amostra de software comercial versionada por engano é irreversível. O CI fecha
# essa porta a cada push.
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Documentação e estrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
            .gitignore
            docs/00-diagnostico.md
            docs/01-arquitetura.md
            docs/02-catalogo-ferramentas.md
            docs/03-licencas.md
            docs/04-instalacao.md
            docs/05-mcp.md
            docs/06-workflows.md
            docs/07-operacao-por-ia.md
            docs/08-higiene-e-seguranca.md
            config/env/unboxre.env.example
            docs/tools/README.md
            scripts/health-check.sh
            scripts/bootstrap-wsl.sh
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then echo "::error::arquivo obrigatório ausente: $f"; missing=1; fi
          done
          [[ $missing -eq 0 ]] && echo "Todos os arquivos obrigatórios presentes."

      - name: Nenhum arquivo de docs/ engolido pelo .gitignore
        # Um padrão não ancorado no .gitignore (ex.: `tools/`) casa com qualquer
        # diretório de mesmo nome em qualquer nível — foi o que escondeu
        # docs/tools/ na primeira tentativa de publicação. Este passo prende.
        run: |
          set -euo pipefail
          ignored=$(git ls-files --others --ignored --exclude-standard --directory docs/ || true)
          if [[ -n "$ignored" ]]; then
            echo "::error::arquivos em docs/ estão ignorados pelo .gitignore:"
            echo "$ignored"
            echo "Ancore o padrão do .gitignore na raiz (ex.: /tools/ em vez de tools/)."
            exit 1
          fi
          echo "Nenhum arquivo de docs/ ignorado. OK."

      - name: Validar templates JSON do MCP
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in config/mcp/*.json; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error::JSON inválido: $f"; fail=1
            else
              echo "ok: $f"
            fi
          done
          exit $fail

      - name: Lint dos scripts shell (shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/health-check.sh scripts/bootstrap-wsl.sh

      - name: health-check.sh --json produz JSON válido e stdout limpo
        # O uso documentado é `--json > reports/health.json`, então o stdout não
        # pode trazer texto humano junto ao objeto JSON. Sem os binários de
        # terceiros o relatório tem FAILs e o script sai 1 — esperado aqui; o que
        # este passo prende é o stdout ser SÓ o JSON.
        run: |
          set -euo pipefail
          bash scripts/health-check.sh --json > /tmp/health.json || true
          test -s /tmp/health.json || { echo "::error::health-check.sh --json não produziu saída"; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/health.json', encoding='utf-8')); print('health.json válido:', d['summary'])"

      - name: Sintaxe de todos os scripts Node (.mjs)
        run: |
          set -euo pipefail
          for f in scripts/*.mjs; do
            node --check "$f" && echo "ok: $f"
          done

      - name: Sintaxe de todos os scripts shell (.sh)
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f" && echo "ok: $f"; done

      - name: Sintaxe de todos os scripts Python (.py)
        # O toolkit tem script Python (disasm-range.py). O equivalente do `node --check`
        # e do `bash -n` para Python é COMPILAR sem executar: um erro de sintaxe só
        # apareceria na mão de quem estivesse analisando um alvo, no meio do caso.
        run: |
          set -euo pipefail
          shopt -s nullglob
          py=(scripts/*.py)
          if [[ ${#py[@]} -eq 0 ]]; then echo "nenhum .py em scripts/"; exit 0; fi
          for f in "${py[@]}"; do python3 -m py_compile "$f" && echo "ok: $f"; done
          rm -rf scripts/__pycache__   # py_compile deixa resíduo; não versione e não deixe sujo

      - name: Sintaxe de todos os scripts PowerShell (.ps1)
        # O host do toolkit é o Windows PowerShell 5.1. Um erro de sintaxe num .ps1
        # só aparece quando alguém o executa — a menos que o parseie aqui.
        shell: pwsh
        run: |
          $fail = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $fail = $true
              Write-Host "::error::erro de sintaxe em $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (linha $($_.Extent.StartLineNumber))" }
            } else { Write-Host "ok: $($_.Name)" }
          }
          if ($fail) { exit 1 }

      - name: Gerador de config MCP produz JSON válido
        # Garante que o script roda e que --list emite JSON parseável. Não toca em
        # nenhum config de cliente: é um teste de fumaça do dialeto de saída.
        run: |
          set -euo pipefail
          node scripts/gen-mcp-config.mjs --list --json > /tmp/mcp-clients.json
          python3 -c "import json; d=json.load(open('/tmp/mcp-clients.json', encoding='utf-8')); assert d and d[0]['slug']; print('clientes MCP:', [c['slug'] for c in d])"

      - name: Consistência docs ↔ código ↔ licenças
        # O teste de regressão que a doutrina pede: pega perfis/flag/cliente
        # citados na doc que não existem no código, ferramenta instalada sem
        # crédito, link de doc quebrado, JSON de MCP inválido. Offline.
        run: node scripts/check-consistency.mjs

  licenses:
    name: Licenças contra a fonte primária
    runs-on: ubuntu-latest
    # Job próprio porque precisa de rede. O check-consistency é offline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar cada licença declarada no upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-licenses.mjs --strict

  mcp-smoke:
    name: Ponte MCP do REA sobe e responde
    runs-on: ubuntu-latest
    # A ponte MCP do REA é stdio: dá para provar num runner headless que ela
    # inicia e responde a um handshake real (initialize + tools/list). O plugin
    # x64dbg-MCP não entra aqui — ele só escuta com a GUI do x64dbg aberta.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar o REA do npm (terceiro, não versionado)
        run: npm install --prefix .rea-ci --no-audit --no-fund rea-agents
      - name: Handshake MCP real (initialize + tools/list)
        run: node scripts/smoke-mcp.mjs .rea-ci/node_modules/rea-agents/scripts/rea.mjs

  secrets:
    name: Scan de segredos e binários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar scan-secrets.ps1
        shell: pwsh
        run: |
          ./scripts/scan-secrets.ps1 -Json | Tee-Object -FilePath secrets-report.json
        continue-on-error: false

      - name: Confirmar que nenhum binário está rastreado
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(exe|dll|so|dylib|bin|o|lib|pdb|dp32|dp64|apk|dex|class|jar|wasm)$' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::binários rastreados no Git:"; echo "$bad"; exit 1
          fi
          echo "Nenhum binário rastreado. OK."

      - name: Confirmar que work/ e segredos não estão rastreados
        # work/ é área de amostras e não vai para o Git — exceto o sentinel
        # work/.gitkeep, que o .gitignore libera de propósito para manter o
        # diretório no clone. Mesma regra do scan-secrets.ps1.
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '^(work/|config/env/unboxre\.env$|x64dbg/mcp_config\.json$)' | grep -vE '^work/\.gitkeep$' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::arquivos que não devem ser publicados:"; echo "$bad"; exit 1
          fi
          echo "Nenhum arquivo sensível rastreado. OK."

      - name: Upload do relatório de segredos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: secrets-report.json
          if-no-files-found: ignore
